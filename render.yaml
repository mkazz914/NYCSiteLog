services:
  - type: web
    name: sitelog-nyc
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:push && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
